name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A new push to the same pull request cancels its outdated run. Runs on
# develop and main always finish, so a later deploy is never cut off midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # This job never pushes, so the token is not kept in the checkout.
          persist-credentials: false

      # Exact version from .nvmrc. npm caching is on automatically because
      # package.json sets packageManager to npm.
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build
