server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Caddy terminates TLS in front of this container. Relative redirects keep
    # nginx from sending visitors to http://...:8080 (e.g. for / -> /de/ later).
    absolute_redirect off;

    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;

    # No access log: it would store every visitor's IP (forwarded by Caddy).
    access_log off;

    # Every route is prerendered to its own index.html. Unknown paths get a
    # real 404 instead of the app shell, so there is no SPA fallback here.
    # HTML and files from public/ keep their names across builds, so browsers
    # revalidate them on every visit.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Build output with a content hash in its name (main-TI2FQQ3S.js,
    # media/font-ABCD1234.woff2) never changes, so browsers may keep it.
    # Case-sensitive on purpose: Angular's hashes are upper case.
    location ~ "-[A-Z0-9]{8}\.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|avif)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}